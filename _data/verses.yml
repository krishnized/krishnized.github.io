# Kṛṣṇa's words on work offered to Him. The first shows first, then they rotate.
# en: fragment of the English; ru: fragment of the Russian BBT translation (vedabase.io/ru), verbatim.
# A quote that is not a Gītā verse gives cite: [English, Russian] and url instead of ref.

- sa: yat karoṣi … tat kuruṣva mad-arpaṇam
  en: Whatever you do, do that as an offering to Me.
  ru: Чем бы ты ни занимался… делай это… как подношение Мне.
  ref: "9.27"

# The word itself, by Śrīla Prabhupāda. Russian: our translation (no official text of this lecture).
- en: Without being Kṛṣṇized, you cannot understand what is Kṛṣṇa, you cannot associate with Him.
  ru: Не став кришнизированным, невозможно понять, что такое Кришна, невозможно общаться с Ним.
  cite: ["Śrīla Prabhupāda, lecture on Śrīmad-Bhāgavatam 1.16.16, Los Angeles, 1974", "Шрила Прабхупада, лекция по Шримад-Бхагаватам 1.16.16, Лос-Анджелес, 1974"]
  url: https://vedabase.io/en/library/transcripts/740111sbla/

- sa: mad-artham api karmāṇi kurvan siddhim avāpsyasi
  en: Work for My sake, and you will attain perfection.
  ru: Трудись для Меня, ибо, служа Моему делу, ты тоже достигнешь совершенства.
  ref: "12.10"

- sa: sva-karmaṇā tam abhyarcya siddhiṁ vindati
  en: Worshipping Him through your own work, you reach perfection.
  ru: Исполняя предписанные ему обязанности, любой человек может достичь совершенства, если поклоняется всепроникающему Господу.
  ref: "18.46"

- sa: patraṁ puṣpaṁ phalaṁ toyaṁ … bhaktyā … aśnāmi
  en: A leaf, a flower, fruit or water — offered with love, I accept.
  ru: Если человек с любовью и преданностью поднесет Мне листок, цветок, плод или немного воды, Я непременно приму его подношение.
  ref: "9.26"

- sa: mat-karma-kṛn mat-paramo … sa mām eti
  en: One who works for Me, devoted to Me, comes to Me.
  ru: Тот, кто… посвящает Мне свой труд, кто считает Меня высшей целью своей жизни… непременно придет ко Мне.
  ref: "11.55"
